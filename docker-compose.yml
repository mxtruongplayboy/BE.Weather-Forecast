# BE.Weather-Forecast — production docker-compose
#
# Stack ĐỘC LẬP với BE.Weather-Tiles (project=noaa_be tại :6969).
# Cùng VPS được (206.72.200.120), nhưng:
#   - Project: open-meteo-forecast
#   - Network: omfc-net (riêng)
#   - Container prefix: omfc-*
#   - Host port: 6968 (mirror pattern 6969 của tile-BE)
#   - Data volume: ./data riêng, KHÔNG share GRIB2 cache với tile-server
#
# Triển khai:
#   1. scp -r BE.Weather-Forecast/ user@206.72.200.120:/opt/open-meteo-forecast/
#   2. ssh user@206.72.200.120
#   3. cd /opt/open-meteo-forecast
#   4. docker compose up -d
#   5. docker compose logs -f sync-gfs   (theo dõi download từ S3 ~5-15 phút)
#
# Smoke test (sau khi sync xong):
#   curl 'http://206.72.200.120:6968/v1/forecast?latitude=10.77&longitude=106.7&current=temperature_2m'
#
# Persistent state: ./data + ./logs — survive `docker compose down`.
# Source code: github.com/open-meteo/open-meteo (AGPL-3.0)
# Data flow: NOAA/ECMWF/CAMS → Open-Meteo S3 mirror (openmeteo.s3.amazonaws.com)
# → sync container kéo .om files đã convert sẵn → ./data → omfc-api serve.
# Mình KHÔNG download GRIB2 trực tiếp từ NOMADS nữa (sync command bỏ download-loop).

name: open-meteo-forecast

networks:
  omfc-net:
    name: omfc-net
  # Shared cross-stack network (xem BE.Weather-Tiles/docker-compose.yml comment).
  # Admin gọi forecast qua container name `omfc-api:8080`.
  weather-net:
    external: true
    name: weather-net

services:
  # ── REST API (omfc-api) ──────────────────────────────────────────────────
  # Phục vụ /v1/forecast + /v1/air-quality + /v1/search trên port 8080 nội bộ.
  # Host map sang 6968 (mirror pattern :6969 của tile-BE).
  api:
    image: ghcr.io/open-meteo/open-meteo:latest
    container_name: omfc-api
    restart: unless-stopped
    networks: [omfc-net, weather-net]
    labels:
      # Opt-in auto-update qua Weather-Watchtower (4 AM check).
      com.centurylinklabs.watchtower.enable: "true"

    # CPU contention shield (giống tile-BE). API server không nặng CPU,
    # chỉ đọc .om cache + interpolate → cpu cap thấp hơn tile.
    cpu_shares: 2048   # 2× neighbor weight, đủ priority cho API

    ports:
      # Bind 127.0.0.1 ONLY → port 6968 KHÔNG listen public interface.
      # Public traffic PHẢI qua nginx vhost SSL (xem nginx/forecast-api.conf).
      # admin BE container vẫn gọi được qua host.docker.internal:6968 (extra_hosts).
      # Mở thẳng cổng 6968 ra Internet để bypass NGINX bị lỗi
      - "0.0.0.0:6968:8080"

    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

    environment:
      TZ: Asia/Ho_Chi_Minh

    # Container hardening — read-only rootfs, drop caps.
    cap_drop: [ALL]
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true

    deploy:
      resources:
        limits:
          # API thường peak ~1-2 GB RAM, set 4G cap để có buffer.
          memory: 4G
          cpus: '1.5'
          pids: 500
        reservations:
          memory: 512M

    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

    command: serve

    healthcheck:
      test:
        - CMD-SHELL
        - 'wget -q -O- "http://127.0.0.1:8080/v1/forecast?latitude=10.77&longitude=106.7&current=temperature_2m" >/dev/null || exit 1'
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 600s   # 10 phút cho batch download đầu

  # ── Sync NOAA GFS (omfc-sync-gfs) ───────────────────────────────────────
  # Download GRIB2 từ nomads.ncep.noaa.gov mỗi 6h. Heavy I/O nhưng spike ngắn.
  sync-gfs:
    image: ghcr.io/open-meteo/open-meteo:latest
    container_name: omfc-sync-gfs
    restart: unless-stopped
    networks: [omfc-net]
    cpu_shares: 1024
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      TZ: Asia/Ho_Chi_Minh
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '1.5'
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "30m"
        max-file: "3"
    # `sync` lấy file .om đã convert sẵn từ Open-Meteo S3 mirror — nhanh + nhẹ
    # hơn nhiều so với download GRIB2 từ NOMADS rồi tự convert.
    # --repeat-interval 15 → poll S3 mỗi 15 phút (không có flag này = chạy 1 lần
    # rồi exit).
    #
    # IMPORTANT: chỉ list RAW variables (có trên S3 mirror). Derived vars như
    # wind_speed_10m, wind_direction_10m, weather_code, dewpoint_2m,
    # apparent_temperature sẽ được binary tự compute on-the-fly từ raw vars
    # khi App gọi /v1/forecast?current=...
    #
    # Mapping derived → raw:
    #   wind_speed_10m, wind_direction_10m ← wind_u_component_10m + wind_v_component_10m
    #   weather_code                       ← precipitation + snowfall_water_equivalent
    #                                        + cloud_cover + categorical_*
    #   dewpoint_2m                        ← temperature_2m + relative_humidity_2m
    #   apparent_temperature               ← temperature + RH + wind + radiation
    #   pressure_msl ↔ surface_pressure    ← bất kỳ cái nào (binary derive cái kia)
    command:
      - sync
      - ncep_gfs013
      - temperature_2m,relative_humidity_2m,precipitation,precipitation_probability,snowfall_water_equivalent,cloud_cover,cloud_cover_low,cloud_cover_mid,cloud_cover_high,shortwave_radiation,uv_index,wind_u_component_10m,wind_v_component_10m,wind_u_component_80m,wind_v_component_80m,wind_gusts_10m,visibility,cape,freezing_level_height
      - --repeat-interval
      - "15"
      - --concurrent
      - "4"
      - --past-days
      - "1"

  # ── Sync ECMWF IFS Open Data (omfc-sync-ecmwf) ───────────────────────────
  sync-ecmwf:
    image: ghcr.io/open-meteo/open-meteo:latest
    container_name: omfc-sync-ecmwf
    restart: unless-stopped
    networks: [omfc-net]
    cpu_shares: 1024
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      TZ: Asia/Ho_Chi_Minh
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '1.5'
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "30m"
        max-file: "3"
    # ECMWF Open Data raw vars trên Open-Meteo S3 mirror.
    # Derived sẽ tự tính (xem comment GFS ở trên).
    command:
      - sync
      - ecmwf_ifs025
      - temperature_2m,dewpoint_2m,precipitation,precipitation_probability,snowfall_water_equivalent,cloud_cover_low,cloud_cover_mid,cloud_cover_high,wind_u_component_10m,wind_v_component_10m,wind_u_component_100m,wind_v_component_100m,wind_gusts_10m,pressure_msl,visibility
      - --repeat-interval
      - "15"
      - --concurrent
      - "4"
      - --past-days
      - "1"

  # ── Sync DWD ICON Global (omfc-sync-icon) ────────────────────────────────
  # DWD ICON cung cấp `visibility` mà GFS/ECMWF không có.
  # `sync` nhận tên STORAGE DOMAIN (dwd_icon, dwd_icon_eu, dwd_icon_d2…), KHÔNG
  # nhận tên model của API như `icon_seamless` — tên đó làm binary thoát ngay
  # với invalidValue và container restart >6000 lần (phát hiện 2026-09-29).
  # icon_eu/icon_d2 không phủ Việt Nam nên chỉ cần dwd_icon (global).
  # Chỉ sync các biến cần thiết để tiết kiệm disk + bandwidth.
  sync-icon:
    image: ghcr.io/open-meteo/open-meteo:latest
    container_name: omfc-sync-icon
    restart: unless-stopped
    networks: [omfc-net]
    cpu_shares: 512
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      TZ: Asia/Ho_Chi_Minh
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: '1.0'
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "30m"
        max-file: "3"
    command:
      - sync
      - dwd_icon
      - visibility,precipitation_probability,pressure_msl,weather_code
      - --repeat-interval
      - "30"
      - --concurrent
      - "2"
      - --past-days
      - "1"

  # ── Sync CAMS Global Air Quality (omfc-sync-aqi) ─────────────────────────
  # IMPORTANT: dùng `cams_global`, KHÔNG phải `cams_europe`.
  # cams_europe chỉ phủ Châu Âu → Việt Nam không có data → AQI rỗng.
  sync-aqi:
    image: ghcr.io/open-meteo/open-meteo:latest
    container_name: omfc-sync-aqi
    restart: unless-stopped
    networks: [omfc-net]
    cpu_shares: 512
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      TZ: Asia/Ho_Chi_Minh
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "30m"
        max-file: "3"
    command:
      - sync
      - cams_global
      - pm2_5,pm10,carbon_monoxide,nitrogen_dioxide,ozone,sulphur_dioxide,dust,aerosol_optical_depth,uv_index
      - --repeat-interval
      - "30"
      - --concurrent
      - "2"
      - --past-days
      - "1"

  # ── Sync GFS Wave (omfc-sync-wave) ───────────────────────────────────────
  # Wave height/direction/period cho AI BE marine risk engine.
  # ncep_gfswave025: GFS Wave global 0.25° (storage domain; `ncep_gfs_wave`
  # không tồn tại → crash loop như sync-icon).
  # Endpoint: /v1/marine?latitude=X&longitude=Y&hourly=wave_height,wave_direction,wave_period
  sync-wave:
    image: ghcr.io/open-meteo/open-meteo:latest
    container_name: omfc-sync-wave
    restart: unless-stopped
    networks: [omfc-net]
    cpu_shares: 512
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      TZ: Asia/Ho_Chi_Minh
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "30m"
        max-file: "3"
    command:
      - sync
      - ncep_gfswave025
      - wave_height,wave_direction,wave_period,wind_wave_height,wind_wave_direction,wind_wave_period,swell_wave_height,swell_wave_direction,swell_wave_period
      - --repeat-interval
      - "30"
      - --concurrent
      - "2"
      - --past-days
      - "1"

# Tổng tài nguyên cap khi peak: 14G RAM, 5.5 cores. Trên VPS 206.72.200.120
# (đã có tile-BE chiếm 2.5 cores + 12G), cần đảm bảo host có ≥20G RAM + 8 cores
# tổng. Idle ~3G RAM (chỉ omfc-api active), sync-* idle/sleep giữa các runs.
