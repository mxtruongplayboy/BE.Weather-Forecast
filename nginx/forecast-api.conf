# nginx vhost RIÊNG cho Forecast Backend (Open-Meteo self-host).
# KHÔNG share zone / cert / log với tile-server.
#
# Cài đặt:
#   1. Copy file này lên VPS:
#        sudo cp forecast-api.conf /etc/nginx/sites-available/
#   2. Đổi `forecast-api.yourdomain.com` thành subdomain thật của bạn.
#   3. Enable + lấy cert Let's Encrypt:
#        sudo ln -s /etc/nginx/sites-available/forecast-api.conf \
#                   /etc/nginx/sites-enabled/
#        sudo certbot --nginx -d forecast-206-72-200-120.nip.io
#   4. Reload:
#        sudo nginx -t && sudo systemctl reload nginx

# ── Rate limit zone RIÊNG (không trùng zone của tile-server) ────────────────
# 30 req/s/IP, burst 60 — đủ rộng cho user app, chặn được scraper bên ngoài.
limit_req_zone $binary_remote_addr zone=omfc_zone:10m rate=30r/s;

# ── Cache zone cho proxy response (60s TTL — vì GFS chỉ update mỗi 6h) ─────
proxy_cache_path /var/cache/nginx/omfc levels=1:2 keys_zone=omfc_cache:10m
  max_size=500m inactive=10m use_temp_path=off;

# ── HTTP → HTTPS redirect ──────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name forecast-206-72-200-120.nip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS forecast-api ─────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name forecast-206-72-200-120.nip.io;

    # SSL certificates (Let's Encrypt sẽ điền tự động khi chạy certbot)
    ssl_certificate     /etc/letsencrypt/live/forecast-206-72-200-120.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forecast-206-72-200-120.nip.io/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL_omfc:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy no-referrer;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Rate limit per-IP (chặn abuse từ bên ngoài, không ảnh hưởng user thật)
    limit_req zone=omfc_zone burst=60 nodelay;
    limit_req_status 429;

    # Logs RIÊNG (không trộn với tile-server log)
    access_log /var/log/nginx/forecast-api.access.log;
    error_log  /var/log/nginx/forecast-api.error.log warn;

    # ── CORS: chỉ cho phép app (nếu cần test từ browser dev) ───────────────
    # Forecast API nên được gọi từ mobile app — không có Origin header,
    # nên không cần CORS. Bỏ comment nếu muốn enable cho web client:
    # add_header Access-Control-Allow-Origin "https://yourdomain.com" always;
    # add_header Access-Control-Allow-Methods "GET, OPTIONS" always;

    # ── Reverse proxy → Open-Meteo container (port 6968 nội bộ) ────────────
    location / {
        proxy_pass http://127.0.0.1:6968;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cache 60s vì forecast data chỉ thay đổi mỗi 6h
        proxy_cache omfc_cache;
        proxy_cache_valid 200 60s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;

        # Timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # Block các path không cần thiết để tránh probe
    location = /favicon.ico { access_log off; log_not_found off; return 204; }
    location ~ /\.       { deny all; }
}
